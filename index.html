  var C = data.config, P = data.planets;
  var $ = function (id) { return document.getElementById(id); };
  var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var destiny = C.mode === 'destiny';
  var revealTimer = null;

  // ---------- утилиты ----------
  function digitSum(v) {
    var n = String(v).split('').reduce(function (a, d) { return a + Number(d); }, 0);
    while (n > 9) n = String(n).split('').reduce(function (a, d) { return a + Number(d); }, 0);
    return n;
  }
  function daysIn(m, y) {               // m: 1–12; без года февраль допускает 29
    if (m === 2) return (!y || (y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0))) ? 29 : 28;
    return [4, 6, 9, 11].indexOf(m) >= 0 ? 30 : 31;
  }
  function withUtm(url) {
    if (!url || !C.utm || !/^https?:/i.test(url)) return url;
    var hash = '', i = url.indexOf('#');
    if (i >= 0) { hash = url.slice(i); url = url.slice(0, i); }
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + C.utm + hash;
  }
  function paragraphs(el, text) {
    el.textContent = '';
    String(text || '').split(/\n\s*\n/).forEach(function (t) {
      var p = document.createElement('p'); p.textContent = t.trim(); el.appendChild(p);
    });
  }
  function money(v) { return Number(v).toLocaleString('ru-RU') + ' ' + (C.currency || '₽'); }
  function copyText(text, hintEl, okMsg, selectEl) {
    function fallback() {
      if (selectEl) {
        var r = document.createRange(); r.selectNodeContents(selectEl);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      }
      hintEl.textContent = 'Не получилось скопировать автоматически — выделите и скопируйте вручную' + (selectEl ? '.' : ': ' + text);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { hintEl.textContent = okMsg; }, fallback);
    } else fallback();
  }

  // ---------- заполнение статики ----------
  root.querySelectorAll('[data-p]').forEach(function (el) { paragraphs(el, C[el.getAttribute('data-p')]); });

  var daySel = $('prasad-day'), monSel = $('prasad-month'), yearSel = $('prasad-year');
  for (var d = 1; d <= 31; d++) daySel.add(new Option(d, d));
  MONTHS.forEach(function (m, i) { monSel.add(new Option(m, i + 1)); });
  if (destiny) {
    $('prasad-year-field').hidden = false;
    yearSel.required = true;
    for (var y = new Date().getFullYear(); y >= 1920; y--) yearSel.add(new Option(y, y));
  }

  $('prasad-vk').href = C.vk_url; $('prasad-vk').textContent = C.vk_url.replace(/^https?:\/\//, '');
  $('prasad-site').href = withUtm(C.site_url); $('prasad-site').textContent = C.site_url.replace(/^https?:\/\//, '');
  $('prasad-collection').href = withUtm(C.collection_url);
  if (C.all_hymns_url) $('prasad-all-hymns').href = withUtm(C.all_hymns_url);
  else $('prasad-all-hymns').hidden = true;
  $('prasad-all-price').innerHTML = '';
  if (Number(C.all_hymns_price) > 0) {
    $('prasad-all-price').textContent = money(C.all_hymns_price);
    if (Number(C.all_hymns_old_price) > Number(C.all_hymns_price)) {
      var s = document.createElement('s'); s.textContent = money(C.all_hymns_old_price);
      s.setAttribute('aria-label', 'обычная цена ' + money(C.all_hymns_old_price));
      $('prasad-all-price').appendChild(s);
    }
  } else $('prasad-all-price').hidden = true;

  // скидка: code — промокод (на весь магазин); category/manual — цены уже снижены на полке
  if (C.discount_mode === 'code') {
    $('prasad-code').textContent = C.promo_code;
    $('prasad-discount-text').textContent = 'Промокод даёт ' + C.discount_percent + ' % ' + (C.code_scope_text || 'на всё в подборке') + ' ' + C.valid_until_text + '.';
  } else {
    $('prasad-code-block').hidden = true;
    $('prasad-discount-text').textContent = 'Праздничные цены уже на полке — скидка ' + C.discount_percent + ' % на всю подборку ' + C.valid_until_text + ', код не нужен.';
  }
  $('prasad-sankalpa-text').textContent = 'Впишите имя — ' + C.puja_date_text + ' я внесу его в санкальпу пуджи.';

  // ---------- форма Тильды (санкальпа) ----------
  function sankalpaTarget() {
    var a = String(C.sankalpa_anchor || '#sankalpa').replace(/^#/, '');
    return document.getElementById(a) || document.querySelector('a[name="' + a + '"]');
  }
  function sankalpaRec() {             // блок Тильды с формой: сам якорь или ближайший .t-rec после него
    var t = sankalpaTarget(); if (!t) return null;
    var rec = t.closest ? t.closest('.t-rec') : null;
    if (rec && !rec.contains(root)) return rec;
    var n = t; while (n && !(n.classList && n.classList.contains('t-rec'))) n = n.nextElementSibling || (n.parentElement && n.parentElement.nextElementSibling);
    return n && !n.contains(root) ? n : null;
  }
  function setFormVisible(v) {
    if (!C.hide_form_until_reveal) return;
    var rec = sankalpaRec(); if (rec) rec.style.display = v ? '' : 'none';
  }
  // Тильда может дорисовать блоки позже — прячем после загрузки
  setFormVisible(false);
  window.addEventListener('load', function () { if ($('prasad-reveal').hidden) setFormVisible(false); });

  $('prasad-to-sankalpa').addEventListener('click', function () {
    var t = sankalpaRec() || sankalpaTarget();
    if (t) t.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
    else location.hash = C.sankalpa_anchor;
  });

  // ---------- расчёт и раскрытие ----------
  function show(planet, day, month) {
    root.style.setProperty('--p-accent', planet.accent || '#C9A227');
    var g = $('prasad-glyph'); g.textContent = '';
    if (planet.image) { var img = new Image(); img.src = planet.image; img.alt = ''; g.appendChild(img); }
    else g.textContent = planet.glyph + '︎';
    $('prasad-kicker').textContent = (destiny ? 'Число судьбы ' : 'Ваше число ') + planet.number + ' · ' + (planet.weekday || '');
    $('prasad-graha-name').textContent = planet.name;
    $('prasad-graha-sub').textContent = planet.sanskrit;
    $('prasad-graha-line').textContent = planet.line;
    paragraphs($('prasad-graha-message'), planet.message);

    var hymn = $('prasad-hymn');
    hymn.href = planet.hymn_pdf;
    hymn.setAttribute('download', 'gimn-' + planet.key + '.pdf');
    hymn.textContent = 'Скачать гимн ' + (planet.name_gen || planet.name);


    $('prasad-intro').hidden = true;
    $('prasad-result').hidden = false;
    $('prasad-reveal').hidden = true;
    $('prasad-code-hint').textContent = ''; $('prasad-share-hint').textContent = '';
    root.classList.remove('is-lit', 'is-static');
    void root.offsetWidth;               // перезапуск анимации при повторном расчёте
    root.classList.add(reduced ? 'is-static' : 'is-lit');
    root.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
    clearTimeout(revealTimer);
    revealTimer = setTimeout(function () {
      $('prasad-reveal').hidden = false;
      setFormVisible(true);
      $('prasad-graha-name').setAttribute('tabindex', '-1');
      $('prasad-graha-name').focus({ preventScroll: true });
    }, reduced ? 0 : 1800);
  }

  $('prasad-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var err = $('prasad-error'); err.textContent = '';
    var day = Number(daySel.value), month = Number(monSel.value), year = Number(yearSel.value) || 0;
    if (!day || !month || (destiny && !year)) {
      err.textContent = destiny ? 'Выберите день, месяц и год рождения.' : 'Выберите день и месяц рождения.';
      (!day ? daySel : !month ? monSel : yearSel).focus(); return;
    }
    if (day > daysIn(month, destiny ? year : 0)) {
      err.textContent = 'В ' + (month === 2 && day === 29 ? year + ' году нет 29 февраля' : 'этом месяце нет ' + day + '-го числа') + ' — проверьте, пожалуйста, дату.';
      daySel.focus(); return;
    }
    var n = destiny ? digitSum('' + day + month + year) : digitSum(day);
    var planet = P.filter(function (p) { return p.number === n; })[0];
    if (!planet) { err.textContent = 'Не нашлось грахи для числа ' + n + '.'; return; }
    show(planet, day, month);
  });

  $('prasad-copy-code').addEventListener('click', function () {
    copyText(C.promo_code, $('prasad-code-hint'), 'Код ' + C.promo_code + ' скопирован — вставьте его в корзине.', $('prasad-code'));
  });
  $('prasad-share').addEventListener('click', function () {
    var url = location.href.split('#')[0];
    copyText(url, $('prasad-share-hint'), 'Ссылка скопирована — отправьте её близким.', null);
  });
  $('prasad-again').addEventListener('click', function () {
    clearTimeout(revealTimer);
    $('prasad-result').hidden = true;
    $('prasad-intro').hidden = false;
    root.classList.remove('is-lit', 'is-static');
    setFormVisible(false);
    $('prasad-error').textContent = '';
    root.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
    daySel.focus({ preventScroll: true });
  });

  // для тестов из консоли: prasadGraha(29) → 2
  window.prasadGraha = function (day) { return digitSum(day); };
})();
</script>

</div>
<a name="sankalpa" style="font-size:0"></a>
<div id="rec2" class="r t-rec"><div class="mock-form">
  <h3>Форма Тильды (BF) — макет</h3>
  <label>Имя *<input required></label>
  <label>Намерение или пожелание<textarea maxlength="200" rows="3"></textarea></label>
  <button type="button" onclick="this.textContent='Имя записано. Пуджа — 21 октября, после неё пришлю прасад в клуб'">Вписать имя</button>
</div></div>
